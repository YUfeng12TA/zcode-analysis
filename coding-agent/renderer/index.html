<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https:;">
<title>DeskCoder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">DeskCoder</div>
    <div id="workspaceBar" title="工作目录">未选择工作目录</div>
    <button id="newSessionBtn" class="btn primary">＋ 新会话</button>
    <div id="sessionList" class="session-list"></div>
    <button id="settingsBtn" class="btn ghost">⚙ 设置</button>
  </aside>

  <main id="main">
    <div id="messages"></div>
    <div id="inputBar">
      <textarea id="input" rows="1" placeholder="描述你要做的编程任务…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="sendBtn" class="btn primary">发送</button>
      <button id="stopBtn" class="btn danger hidden">停止</button>
    </div>
  </main>
</div>

<div id="settingsModal" class="modal hidden">
  <div class="modal-card">
    <h2>模型设置</h2>
    <label>API Base URL
      <input id="sBaseURL" placeholder="https://api.openai.com/v1" />
    </label>
    <label>API Key
      <input id="sApiKey" type="password" placeholder="sk-…" autocomplete="off" />
    </label>
    <label>模型
      <input id="sModel" placeholder="gpt-4o-mini" />
    </label>
    <label>Temperature
      <input id="sTemp" type="number" step="0.1" min="0" max="2" placeholder="0.2" />
    </label>
    <label>工作目录
      <div class="row">
        <input id="sWorkspace" placeholder="未选择，默认用户主目录" readonly />
        <button id="pickWorkspaceBtn" class="btn">浏览…</button>
      </div>
    </label>
    <div class="modal-actions">
      <button id="settingsCancel" class="btn ghost">取消</button>
      <button id="settingsSave" class="btn primary">保存</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
